name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package Linux release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="red_text_editor-v${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG_NAME}"

          cp target/release/red_text_editor "dist/${PKG_NAME}/"
          cp -r assets "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/"

          tar -C dist -czf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"
          cd dist
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $Version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          if (-not $Version) { $Version = "dev" }
          $PkgName = "red_text_editor-v$Version-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$PkgName" -Force

          Copy-Item "target/release/red_text_editor.exe" "dist/$PkgName/"
          Copy-Item -Recurse "assets" "dist/$PkgName/"
          Copy-Item "README.md" "dist/$PkgName/"

          Compress-Archive -Path "dist/$PkgName/*" -DestinationPath "dist/$PkgName.zip"
          $Hash = (Get-FileHash -Path "dist/$PkgName.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $PkgName.zip" | Out-File -FilePath "dist/$PkgName.zip.sha256" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.zip
            dist/*.zip.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
