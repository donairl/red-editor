[package]
name = "red_text_editor"
version = "0.5.1"
edition = "2024"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] } # Gunakan versi terbaru yang stabil
rfd = "0.17"
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "yaml-load", "default-syntaxes", "default-themes", "regex-fancy"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
pulldown-cmark = { version = "0.13", default-features = false }
portable-pty = "0.9"
vt100 = "0.18"


# winit 0.30.13 with a fix for moving the window onto a monitor with another
# display scale on Windows. See vendor/README.md.
[patch.crates-io]
winit = { path = "vendor/winit" }
