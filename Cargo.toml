[package]
name = "red_text_editor"
version = "1.0.1"
edition = "2024"
authors = ["Donny Airlangga"]
description = "A light VS Code-style text editor built with Rust and egui"
license = "MIT"
repository = "https://github.com/donairl/red-editor"

[dependencies]
serde = "1"
eframe = { version = "0.37", features = ["persistence"] } # Gunakan versi terbaru yang stabil
rfd = "0.17"
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "yaml-load", "default-syntaxes", "default-themes", "regex-fancy"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
pulldown-cmark = { version = "0.13", default-features = false }
portable-pty = "0.9"
vt100 = "0.18"
similar = "2"
trash = "5"
# Agent Client Protocol wire types (serde only; no async runtime).
agent-client-protocol-schema = { version = "1.18", default-features = false }

# Kills a process group directly (`killpg`) instead of running `kill`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# winit 0.30.13 with a fix for moving the window onto a monitor with another
# display scale on Windows. See vendor/README.md.
[patch.crates-io]
winit = { path = "vendor/winit" }
