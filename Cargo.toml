[package]
name = "red_text_editor"
version = "0.2.6"
edition = "2024"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] } # Gunakan versi terbaru yang stabil
rfd = "0.17"
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }

